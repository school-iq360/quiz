function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}

function nodeAt(p){var n={items:TREE};p.forEach(function(k){n=n.items[k]});return n}
function home(){
  var h='<h1>Готовься к экзаменам и олимпиадам</h1><p class="lead">Тесты для 6–11 классов, ОГЭ, ЕГЭ и олимпиад. Бесплатно и без регистрации.</p><div class="tiles">';
  TREE.forEach(function(x,k){h+=tile(x.em,x.name,x.desc,0,k)});
  app.innerHTML=h+'</div>';
  app.querySelectorAll('.tile').forEach(function(b){b.onclick=function(){view([+b.dataset.i])}});
  window.scrollTo(0,0);
}
function view(p){
  if(!p.length)return home();
  var n=nodeAt(p),h='<button class="back" id="back">← Назад</button><h1>'+esc(n.name)+'</h1><p class="lead">'+n.lead+'</p><div class="tiles">';
  n.items.forEach(function(t,k){h+=tile(t.em,t.name,t.items?t.desc:(t.q?t.q.length+' вопросов':'Скоро'),!t.items&&!t.q,k)});
  app.innerHTML=h+'</div>';
  document.getElementById('back').onclick=function(){view(p.slice(0,-1))};
  app.querySelectorAll('.tile').forEach(function(b){b.onclick=function(){var q=p.concat(+b.dataset.i);if(nodeAt(q).items)view(q);else start(q)}});
  window.scrollTo(0,0);
}
function start(p){cur=p;var n={items:TREE},nm=[];p.forEach(function(k){n=n.items[k];nm.push(n.name)});quiz={name:nm.join(' · '),q:n.q};i=0;score=0;show()}
function norm(t){return String(t).toLowerCase().replace(/ё/g,'е').replace(/,/g,'.').replace(/\s+/g,'').replace(/[−–—]/g,'-')}
function show(){
  var q=quiz.q[i];locked=false;
  var h='<div class="bar"><div style="width:'+(i/quiz.q.length*100)+'%"></div></div><div class="meta">'+esc(quiz.name)+': вопрос '+(i+1)+' из '+quiz.q.length+'</div><h2>'+esc(q[0])+'</h2>';
  if(q[3])h+='<input class="ans" id="ans" type="text" autocomplete="off" autocapitalize="off" placeholder="Введите ответ"><div class="row"><button class="btn" id="send">Ответить</button></div>';
  else q[1].forEach(function(o,k){h+='<button class="opt" data-k="'+k+'">'+esc(o)+'</button>'});
  app.innerHTML=h+'<div id="next"></div>';
  if(q[3]){var inp=document.getElementById('ans');document.getElementById('send').onclick=function(){openAnswer(inp)};inp.onkeydown=function(e){if(e.key==='Enter')openAnswer(inp)};inp.focus()}
  else app.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){answer(+b.dataset.k)}});
}
function nextBtn(pre){
  var last=i===quiz.q.length-1;
  document.getElementById('next').innerHTML=(pre||'')+'<div class="row"><button class="btn" id="go">'+(last?'Узнать результат':'Дальше')+'</button></div>';
  document.getElementById('go').onclick=function(){if(last)result();else{i++;show()}};
}
function answer(k){
  if(locked)return;locked=true;
  var right=quiz.q[i][2];if(k===right)score++;
  app.querySelectorAll('.opt').forEach(function(b,n){b.disabled=true;if(n===right)b.classList.add('ok');else if(n===k)b.classList.add('bad')});
  nextBtn();
}
function openAnswer(inp){
  if(locked||!inp.value.trim())return;locked=true;
  var q=quiz.q[i],ok=q[3].some(function(a){return norm(a)===norm(inp.value)});
  if(ok)score++;
  inp.disabled=true;inp.classList.add(ok?'ok':'bad');
  document.getElementById('send').parentNode.style.display='none';
  nextBtn('<div class="fb '+(ok?'ok':'bad')+'">'+(ok?'Верно!':'Неверно. Правильный ответ: '+esc(q[3][0]))+'</div>');
}
function result(){
  var n=quiz.q.length,t=score===n?'Отлично, вы знаток!':score>=n*0.6?'Хороший результат!':'Есть куда расти. Попробуйте ещё раз.';

  document.getElementById('all').onclick=function(){view(cur.slice(0,-1))};

  };
}

var Amb=(function(){

var chords=[[57,60,64,67],[53,57,60,64],[55,59,62,64],[52,55,59,62]],pent=[72,74,76,79,81,84];
function hz(m){return 440*Math.pow(2,(m-69)/12)}
function init(){
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
  var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1400;
  var len=ctx.sampleRate*3,buf=ctx.createBuffer(2,len,ctx.sampleRate);

  rv=ctx.createConvolver();rv.buffer=buf;var wet=ctx.createGain();wet.gain.value=.7;
  bus=ctx.createGain();bus.connect(lp);lp.connect(master);lp.connect(rv);rv.connect(wet);wet.connect(master);
}
function tone(m,t,peak,att,dur,type){
  var o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=hz(m);o.detune.value=(Math.random()-.5)*10;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+.1);
}
function play(){
  var t=ctx.currentTime,ch=chords[step++%chords.length];
  ch.forEach(function(m,i){tone(i===0?m-12:m,t,.07,3,9,i%2?'sine':'triangle')});
  if(Math.random()<.8)tone(pent[Math.floor(Math.random()*pent.length)],t+1.5+Math.random()*3,.05,.02,4,'sine');
}
function set(v){
  on=v;
  if(on){if(!ctx)init();ctx.resume();master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setTargetAtTime(.5,ctx.currentTime,.8);play();timer=setInterval(play,6000)}
  else{clearInterval(timer);if(ctx){master.gain.setTargetAtTime(0,ctx.currentTime,.4);setTimeout(function(){if(!on)ctx.suspend()},1800)}}
}
document.addEventListener('visibilitychange',function(){if(!ctx||!on)return;if(document.hidden)ctx.suspend();else ctx.resume()});
return{
  toggle:function(){if(!on){wish=true;set(true)}else{wish=false;set(false)}return on},
  unlock:function(){if(!wish)return;if(!ctx)init();ctx.resume();if(!on)set(true)},
  tryAuto:function(cb){try{if(!ctx)init();ctx.resume().then(function(){if(ctx.state==='running'&&wish&&!on){set(true);cb()}}).catch(function(){})}catch(e){}},
  blip:function(){
    if(!wish||!ctx)return;
    var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain(),f=hz(pent[Math.floor(Math.random()*pent.length)]);
    o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.5,t+.09);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.28);
    o.connect(g);g.connect(ctx.destination);g.connect(rv);o.start(t);o.stop(t+.3);
  }
};
})();

}
